<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Emerald Gradient -->
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E9B61"/>
      <stop offset="45%" stop-color="#187A4E"/>
      <stop offset="100%" stop-color="#0B3C26"/>
    </linearGradient>

    <!-- Vibrant Mint Trend Arc Gradient -->
    <linearGradient id="trendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <!-- Bar Chart Accent Gradients -->
    <linearGradient id="barGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#DCFCE7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80ED99"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#031E12" flood-opacity="0.45"/>
    </filter>
    
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#4ADE80" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Full-bleed Square for Maskable / Standard App Icon -->
  <rect width="512" height="512" fill="url(#iconBgGrad)"/>

  <!-- Subtle Inner Border Frame -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="6"/>

  <!-- Centered Master Emblem (Safe Zone: within 384x384 circle) -->
  <g filter="url(#iconShadow)">

    <!-- Ascending Financial Bar Chart -->
    <!-- Bar 1 (Shortest - Left) -->
    <rect x="135" y="270" width="42" height="110" rx="10" fill="url(#barGrad1)"/>
    <!-- Bar 2 (Medium - Center) -->
    <rect x="195" y="210" width="42" height="170" rx="10" fill="url(#barGrad1)"/>
    <!-- Bar 3 (Tallest - Right) -->
    <rect x="255" y="145" width="42" height="235" rx="10" fill="url(#barGrad2)"/>

    <!-- Stylized Integrated 'F' Top Wing & Growth Swoop -->
    <!-- Horizontal Top Bar of F merging with growth trajectory -->
    <path d="M 135 145 H 335 C 350 145 360 158 355 172 L 345 195 C 342 201 335 205 328 205 H 255 V 210 H 300 C 312 210 320 220 316 232 L 308 252 C 305 258 299 262 292 262 H 255 V 380 C 255 388 248 395 240 395 H 210 C 202 395 195 388 195 380 V 270 H 135 Z" fill="#FFFFFF" fill-opacity="0.95"/>

    <!-- Dynamic Upward Growth Arrow & Leaf Arc (Representing Analytics & Wealth Increase) -->
    <path d="M 115 340 Q 220 360 345 220 L 320 220 Q 215 330 135 315 Z" fill="url(#trendGrad)" filter="url(#glow)"/>
    
    <!-- Arrow Head at top right -->
    <path d="M 320 150 L 385 160 L 360 225 L 340 190 Z" fill="#4ADE80" filter="url(#glow)"/>
    <circle cx="365" cy="175" r="12" fill="#FFFFFF"/>

  </g>
</svg>
