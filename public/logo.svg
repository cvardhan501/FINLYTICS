<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Rich Emerald Gradient -->
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E9B61"/>
      <stop offset="45%" stop-color="#187A4E"/>
      <stop offset="100%" stop-color="#0B3C26"/>
    </linearGradient>

    <!-- Mint Trend Gradient -->
    <linearGradient id="logoTrendGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>

    <linearGradient id="logoBarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#80ED99"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#031E12" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#logoBgGrad)"/>

  <!-- Outer Glow Ring -->
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="4"/>

  <!-- Centered Logo Graphic Group -->
  <g filter="url(#logoShadow)">
    <!-- Ascending Financial Bar Chart -->
    <rect x="145" y="235" width="36" height="95" rx="8" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="195" y="185" width="36" height="145" rx="8" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="245" y="130" width="36" height="200" rx="8" fill="url(#logoBarGrad)"/>

    <!-- Stylized 'F' & Growth Arrow integration -->
    <path d="M 145 130 H 320 C 332 130 340 140 336 152 L 328 172 C 325 177 319 180 313 180 H 245 V 185 H 285 C 295 185 302 193 299 203 L 292 220 C 289 225 284 228 278 228 H 245 V 330 C 245 337 239 342 232 342 H 208 C 201 342 195 337 195 330 V 235 H 145 Z" fill="#FFFFFF"/>

    <!-- Upward Trend Line Arc & Arrow -->
    <path d="M 125 295 Q 215 310 325 190 L 305 190 Q 210 285 140 275 Z" fill="url(#logoTrendGrad)"/>
    <path d="M 305 130 L 360 140 L 340 195 L 322 165 Z" fill="#4ADE80"/>
    <circle cx="342" cy="152" r="10" fill="#FFFFFF"/>
  </g>

  <!-- FINLYTICS Text -->
  <text x="256" y="422" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="46" letter-spacing="3">
    FIN<tspan fill="#80ED99">LYTICS</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="256" y="462" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="16" letter-spacing="4">
    TRACK • PLAN • SAVE • GROW
  </text>
</svg>
