<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E9B61"/>
      <stop offset="50%" stop-color="#187A4E"/>
      <stop offset="100%" stop-color="#0F5234"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#80ED99"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Logo Graphics Group -->
  <g filter="url(#shadow)">
    <!-- Main Stylized 'F' Body -->
    <path d="M 175 125 H 395 C 405 125 410 137 402 144 L 375 168 C 370 172 363 175 355 175 H 240 V 230 H 340 C 350 230 355 242 347 249 L 325 269 C 320 273 313 275 305 275 H 240 V 385 C 240 395 230 400 220 395 L 180 375 C 176 373 175 368 175 363 V 125 Z" fill="url(#fGrad)"/>
    
    <!-- Growth Leaf Emblem -->
    <path d="M 235 245 C 235 245 320 185 360 215 C 390 238 340 315 255 315 Z" fill="url(#leafGrad)"/>
    
    <!-- Financial Bar Chart Base -->
    <rect x="155" y="325" width="22" height="45" rx="5" fill="#FFFFFF" fill-opacity="0.9"/>
    <rect x="190" y="300" width="22" height="70" rx="5" fill="#FFFFFF" fill-opacity="0.95"/>
    <rect x="225" y="270" width="22" height="100" rx="5" fill="#FFFFFF"/>

    <!-- Upward Trend Arrow Arc -->
    <path d="M 140 365 Q 230 385 345 280 L 370 305 V 245 H 310 L 335 270 Q 235 360 140 340 Z" fill="#80ED99"/>
  </g>

  <!-- FINLYTICS Text -->
  <text x="256" y="440" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" letter-spacing="2">
    FIN<tspan fill="#80ED99">LYTICS</tspan>
  </text>
  
  <!-- Tagline -->
  <text x="256" y="475" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" letter-spacing="3">
    Track • Plan • Save • Grow
  </text>
</svg>
